# Type-check, test and build on every push and pull request, then play the
# built app in a real browser. Hosting is on Cloudflare, which builds the site
# from the repository itself.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch replaces a run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
